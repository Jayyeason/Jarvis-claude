name: Jarvis
options:
  bundleIdPrefix: com.jarvis
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "15.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

targets:
  Jarvis:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: App
      - path: UI
      - path: Commands
      - path: Gateway
      - path: NativeActions
      - path: Store
      - path: Models
    info:
      path: Resources/Info.plist
      properties:
        LSUIElement: true
        LSMinimumSystemVersion: "14.0"
        NSCalendarsUsageDescription: "Jarvis 需要访问日历来添加识别到的日程。"
        NSRemindersUsageDescription: "Jarvis 需要访问提醒事项来添加识别到的任务。"
        NSScreenCaptureUsageDescription: "Jarvis 需要截图权限来识别屏幕内容。"
        NSLocationWhenInUseUsageDescription: "Jarvis 使用位置来搜索附近地点。"
        NSHumanReadableCopyright: "Copyright © 2026 Jarvis. All rights reserved."
    entitlements:
      path: Resources/Jarvis.entitlements
      properties:
        com.apple.security.app-sandbox: false
        com.apple.security.network.client: true
        com.apple.security.personal-information.calendars: true
        com.apple.security.personal-information.reminders: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jarvis.app
        SWIFT_VERSION: "5.9"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGNING_ALLOWED: "YES"
        ENABLE_HARDENED_RUNTIME: "NO"
    dependencies:
      - sdk: AppKit.framework
      - sdk: SwiftUI.framework
      - sdk: ScreenCaptureKit.framework
      - sdk: EventKit.framework
      - sdk: MapKit.framework
      - sdk: CoreLocation.framework
      - sdk: Security.framework
